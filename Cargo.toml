[package]
name = "matejko"
version = "0.1.0"
edition = "2021"
description = "A small photo viewer for Windows"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
glyphon = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pollster = "0.4"
trash = "5"
wgpu = "30"
winit = "0.30.13"

[build-dependencies]
winresource = "0.1"
