[package]
name = "matejko"
version = "0.1.0"
edition = "2021"
description = "A small photo viewer for Windows"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
glyphon = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pollster = "0.4"
trash = "5"
wgpu = "30"
winit = "0.30.13"

[build-dependencies]
winresource = "0.1"

# winit 0.30.13 grows the window when dragging across monitors with
# different DPI (rust-windowing/winit#4041). This is the 0.30 backport of
# the fix from #4341 / #4694. Drop the patch when a fixed 0.30.x or 0.31
# release is in use.
[patch.crates-io]
winit = { git = "https://github.com/rust-windowing/winit", rev = "39c4009c41e5977d779cf8a365792c8153ca77c5" }
